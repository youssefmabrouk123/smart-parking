{% extends "base.html" %}
{% block title %}Sign In - Smart Parking{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <i class="fas fa-user-circle text-primary" style="font-size: 5rem;"></i>
                    <h2 class="mt-4 fw-bold">Sign In</h2>
                    <p class="text-muted">Access your Smart Parking account</p>
                </div>
                <form method="POST" action="{{ url_for('auth.signin') }}">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-medium">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                    </div>
                    <div class="text-center">
                        <p class="mb-0">Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-primary fw-medium">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_css %}
<style>
.card { transition: all 0.3s ease; }
.card:hover { transform: translateY(-5px); }
.form-control:focus { border-color: #4f46e5; }
</style>
{% endblock %}
